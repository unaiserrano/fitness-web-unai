<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: banda negra con el nombre (como la portada del PDF), pestañas fijas debajo, contenido en una columna de hasta 1120px */
:root {
  --bg: #F5F4F1; --panel: #FFFFFF; --panel2: #EEEDE9; --ink: #161514; --muted: #6A6660; --line: #E2DFD9;

  --rir0: #D92D20; --rir1: #F97316; --rir2: #FACC15; --rir3: #16A34A; --rir-ink: #1F1F1F; --rir-na: #C9C5BE;
  --font-d: "Archivo", "Arial Black", "Helvetica Neue", Arial, sans-serif;
  --font-b: "Inter", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r: 10px;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #111110; --panel: #1B1A19; --panel2: #252422; --ink: #F2F0EC; --muted: #A39F98; --line: #302E2B;
  --band: #000000; --band-ink: #F7F5F1; --accent: #FF6B33; --accent-ink: #FFFFFF; --accent-soft: #3A2116;
  --ok: #43C27C; --warn: #F0A23B; --bad: #FF6B5E; --info: #6FA8E8; --rir-na: #4A4743; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #111110; --panel: #1B1A19; --panel2: #252422; --ink: #F2F0EC; --muted: #A39F98; --line: #302E2B;
  --band: #000000; --band-ink: #F7F5F1; --accent: #FF6B33; --accent-ink: #FFFFFF; --accent-soft: #3A2116;
  --ok: #43C27C; --warn: #F0A23B; --bad: #FF6B5E; --info: #6FA8E8; --rir-na: #4A4743; color-scheme: dark }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-b); font-size: 14px; line-height: 1.45; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); }
.wrap { max-width: 1120px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.band { background: var(--band); color: var(--band-ink); }
.band .wrap { padding-block: 22px 18px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.eyebrow { font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); font-weight: 700; }
.band h1 { font-family: var(--font-d); font-weight: 900; font-size: clamp(40px, 8vw, 64px); line-height: .9; margin: 4px 0 0; letter-spacing: -.01em; }

.band .stats { display: flex; gap: 8px; flex-wrap: wrap; }
.band select, .band input { background: #1E1D1B; color: #F7F5F1; border-color: #3A3835; width: auto; }
.band .btn { background: #1E1D1B; color: #F7F5F1; border-color: #3A3835; }

.tip { position: absolute; z-index: 4; pointer-events: none; background: var(--panel); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.18); border-radius: 8px; padding: 7px 10px; font-size: 12px; line-height: 1.4; max-width: min(92%, 340px); font-variant-numeric: tabular-nums; }
.tip small { display: block; color: var(--muted); }
/* Diario */
.week { display: grid; grid-template-columns: 92px minmax(0, 1fr); gap: 16px; }

/* Editor */

.ser .x { grid-column: 6; grid-row: 1; }

.prevtbl { overflow-x: auto; }

.ff-none { aspect-ratio: 3/4; display: grid; place-items: center; background: var(--panel2); border-radius: 10px; text-align: center; padding: 10px; }
.ff-day { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid var(--line); padding-top: 8px; }
.ff-row { display: flex; gap: 8px; flex-wrap: wrap; }
.ff-it { margin: 0; width: 110px; } .ff-it img { width: 110px; height: 146px; object-fit: cover; border-radius: 8px; display: block; background: var(--panel2); }
.ff-it figcaption { display: flex; justify-content: space-between; align-items: center; font-size: 12px; }

    btn.textContent = 'PDF descargado';
  } catch (e) { if (e && e.code !== 'declined') status('No se pudo descargar el PDF: ' + (e.message || e.code), 'bad'); }

}
function construirDietaPDF(d) {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4' });
  const PW = 210, PH = 297, M = 14, OR = [255, 90, 31], BK = [18, 18, 18], GR = [110, 106, 100], LG = [238, 237, 233], LN = [220, 217, 211];
  const txt = (x) => String(x ?? '').replace(/[“”]/g, '"').replace(/[‘’]/g, "'").replace(/[^\x00-\xFF·–—…]/g, '');
  const font = (sz, st = 'normal', col = BK) => { doc.setFont('helvetica', st); doc.setFontSize(sz); doc.setTextColor(...col); };
  doc.setFillColor(...BK); doc.rect(0, 0, PW, 62, 'F'); doc.setFillColor(...OR); doc.triangle(150, 0, PW, 0, PW, 62, 'F');
  font(7.5, 'bold', OR); doc.text(txt((d.titulo || 'Plan de alimentación').toUpperCase()), M, 18, { charSpace: 1.1 });
  font(40, 'bold', [255, 255, 255]); doc.text(txt(NOM().toUpperCase()), M - 1, 38);
  font(9, 'normal', [210, 205, 198]); doc.text(txt([d.intro, d.objetivo ? 'Objetivo aproximado: ' + d.objetivo : ''].filter(Boolean).join('  ·  ')), M, 50);
  let y = 72;
  const cs = d.comidas || [], bw = (PW - 2 * M - 3 * (cs.length - 1)) / Math.max(1, cs.length);
  cs.forEach((c, i) => { const x = M + i * (bw + 3); doc.setDrawColor(...BK); doc.setLineWidth(0.5); doc.rect(x, y, bw, 16); font(6.5, 'bold', OR); doc.text(txt(c.nombre.toUpperCase()), x + 3, y + 6, { charSpace: 0.4 }); font(10, 'bold'); doc.text(txt(c.kcal || ''), x + 3, y + 12.5); });
  y += 26;
  const cw = (PW - 2 * M - 6) / 2;
  const optH = (o) => { let hh = 10; for (const it of o.items || []) hh += it.sub ? 5.5 : 4.6; if (o.nota) { font(7, 'normal'); hh += doc.splitTextToSize(txt(o.nota), cw - 8).length * 3.3 + 3; } return hh + 3; };
  const drawOpt = (o, n, x, y0, hh) => {
    doc.setFillColor(...LG); doc.rect(x, y0, cw, hh, 'F');
    font(15, 'bold', OR); doc.text(String(n), x + 3, y0 + 8);
    font(9.5, 'bold'); doc.text(doc.splitTextToSize(txt(o.titulo), cw - 16)[0] || '', x + 11, y0 + 7.5);
    let yy = y0 + 14;
    for (const it of o.items || []) {
      if (it.sub) { yy += 1; font(6.5, 'bold', OR); doc.text(txt((it.a || '').toUpperCase()), x + 4, yy, { charSpace: 0.3 }); yy += 4.5; continue; }
      font(8, 'normal'); doc.text(txt(it.a), x + 4, yy); font(8, 'bold'); doc.text(txt(it.c), x + cw - 4, yy, { align: 'right' });
      doc.setDrawColor(...LN); doc.setLineWidth(0.15); doc.line(x + 4, yy + 1.4, x + cw - 4, yy + 1.4); yy += 4.6;
    }
    if (o.nota) { font(7, 'italic', GR); const l = doc.splitTextToSize(txt(o.nota), cw - 8); doc.text(l, x + 4, yy + 2); }
  };
  for (const c of cs) {
    if (y + 30 > PH - M) { doc.addPage(); y = M + 8; }
    font(22, 'bold'); doc.text(txt(c.nombre.toUpperCase()), M, y); const tw = doc.getTextWidth(txt(c.nombre.toUpperCase()));
    font(7, 'bold', OR); doc.text(txt(c.kcal || ''), M + tw + 4, y, { charSpace: 0.4 });
    doc.setDrawColor(...BK); doc.setLineWidth(0.8); doc.line(M, y + 2.5, PW - M, y + 2.5); y += 7;
    const ops = c.opciones || [];
    for (let i = 0; i < ops.length; i += 2) {
      const hh = Math.max(optH(ops[i]), ops[i + 1] ? optH(ops[i + 1]) : 0);
      if (y + hh > PH - M) { doc.addPage(); y = M + 4; }
      drawOpt(ops[i], i + 1, M, y, hh); if (ops[i + 1]) drawOpt(ops[i + 1], i + 2, M + cw + 6, y, hh);
      y += hh + 5;
    }
    y += 4;
  }
  const ks = d.consejos || [];
  if (ks.length) {
    const kw = (PW - 2 * M - 3 * (ks.length - 1)) / ks.length;
    font(7, 'normal'); const kh = Math.max(...ks.map((k) => doc.splitTextToSize(txt(k.texto), kw - 8).length * 3.4)) + 16;
    if (y + kh + 10 > PH - M) { doc.addPage(); y = M + 8; }
    font(22, 'bold'); doc.text('CONSEJOS', M, y); doc.setDrawColor(...BK); doc.setLineWidth(0.8); doc.line(M, y + 2.5, PW - M, y + 2.5); y += 8;
    ks.forEach((k, i) => { const x = M + i * (kw + 3); doc.setFillColor(...LG); doc.rect(x, y, kw, kh, 'F'); doc.setFillColor(...OR); doc.rect(x, y, kw, 1.3, 'F'); font(8, 'bold'); doc.text(txt(k.titulo), x + 4, y + 7); font(7, 'normal'); doc.text(doc.splitTextToSize(txt(k.texto), kw - 8), x + 4, y + 12); });
  }
  return doc;
}

const VIEWS = { progreso: vProgreso, diario: vDiario, volumen: vVolumen, rutina: vRutina, dieta: vDieta, pegar: vPegar };
